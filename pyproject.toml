[project]
name = "hmm-client"
version = "0.0.2"
description = "Linux-native client for Huawei E9000 HMM (Hardware Management Module) — replaces the legacy Java applet."
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0",
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "paramiko>=3.4",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
hmm = "hmm_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmm_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: fast pure-Python tests with no I/O",
    "integration: tests that hit a real chassis (skipped in CI)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:paramiko.*",
]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/hmm_client"]
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
# Start permissive; tighten over time
ignore_missing_imports = true
follow_imports = "silent"
