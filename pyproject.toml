[project]
name = "hmm-client"
version = "0.0.1"
description = "Linux-native client for Huawei E9000 HMM (Hardware Management Module) — replaces the legacy Java applet."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "paramiko>=3.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[project.scripts]
hmm = "hmm_client.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmm_client"]

[tool.ruff]
line-length = 100
target-version = "py311"
