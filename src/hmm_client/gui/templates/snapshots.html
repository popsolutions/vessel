<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HMM — Snapshots ({{ host }})</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/hmm.css">
</head>
<body>

{% include "_nav.html" %}

<main class="hmm-main">
  <section class="hmm-card">
    <div class="hmm-card-head">
      <span class="hmm-card-title">Snapshots</span>
      <span class="hmm-mute hmm-tiny">{{ snapshots_dir }}</span>
    </div>
    <div class="hmm-card-body">
    {% if not snapshots %}
      <div class="hmm-muted hmm-tiny">No snapshots taken yet. Run <code>hmm snapshot</code> or trigger an apply with snapshot-first.</div>
    {% else %}
    <table class="hmm-table">
      <thead>
        <tr>
          <th>Snapshot ID (UTC)</th>
          <th style="text-align:right;">Size</th>
          <th>Open</th>
        </tr>
      </thead>
      <tbody>
        {% for s in snapshots %}
        <tr>
          <td><b class="hmm-mono">{{ s.id }}</b></td>
          <td class="hmm-mono" style="text-align:right;">{{ "{:,}".format(s.size) }} B</td>
          <td><a href="/snapshots/{{ s.id }}">view →</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
    </div>
  </section>
</main>

</body>
</html>
