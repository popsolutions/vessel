<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HMM — PSUs & Fans ({{ host }})</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/hmm.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 980px) { .pf-grid { grid-template-columns: 1fr; } }
    .comp-grid { display: grid; gap: 6px; }
    .psu-grid { grid-template-columns: repeat(5, 1fr); }
    .fan-grid { grid-template-columns: repeat(6, 1fr); }
    .comp-tile {
      background: #0f172a; border: 1px solid var(--hmm-card-bd-2); border-radius: 4px;
      padding: 8px 6px; text-align: center; transition: border-color 120ms;
    }
    .comp-tile.alarm-critical { border-color: var(--hmm-danger); background: rgba(231,59,22,.10); }
    .comp-tile.alarm-major    { border-color: var(--hmm-warn);   background: rgba(240,171,0,.10); }
    .comp-tile.alarm-ok       { border-color: rgba(19,190,183,.4); background: rgba(19,190,183,.06); }
    .comp-tile .name { font-weight: 600; font-size: 12px; color: var(--hmm-text); }
    .comp-tile .badge { font-size: 10px; margin-top: 4px; }
    .alarm-list { font-size: 11px; color: var(--hmm-text-soft); margin-top: 4px; max-height: 32px; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

{% include "_nav.html" %}

<main class="hmm-main">
  <section class="hmm-card">
    <div class="hmm-card-head">
      <span class="hmm-card-title">PSUs &amp; Fans · health</span>
      <button class="hmm-btn-ghost"
              hx-get="/api/psus-fans/state" hx-target="#pf-state" hx-swap="innerHTML">↻ refresh</button>
    </div>
    <div class="hmm-card-body">
      <div id="pf-state" hx-get="/api/psus-fans/state" hx-trigger="load" hx-swap="innerHTML">
        <div class="hmm-muted hmm-tiny">Loading…</div>
      </div>
    </div>
  </section>

  <section class="hmm-card">
    <div class="hmm-card-head"><span class="hmm-card-title">Power Capping &amp; Hibernation</span></div>
    <div class="hmm-card-body">
      <p class="hmm-muted hmm-tiny">
        Coming once we reverse-engineer the matching <code>powerhandler</code> verbs (the
        capture only saw <code>queryhandler.status</code> from this page so far). Live PSU
        and fan health above is sourced from <code>selhandler.alarm</code> filtered by
        <code>source</code>.
      </p>
    </div>
  </section>
</main>

</body>
</html>
