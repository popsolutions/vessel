<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HMM — Health ({{ host }})</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/hmm.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>

{% include "_nav.html" %}

<main class="hmm-main">

  <section class="hmm-card">
    <div class="hmm-card-head">
      <span class="hmm-card-title">Active alarms</span>
      <button class="hmm-btn-ghost"
              hx-get="/api/health/alarms" hx-target="#h-alarms" hx-swap="innerHTML">
        ↻ refresh
      </button>
    </div>
    <div class="hmm-card-body">
      <div id="h-alarms" hx-get="/api/health/alarms" hx-trigger="load" hx-swap="innerHTML">
        <div class="hmm-muted hmm-tiny">Loading…</div>
      </div>
    </div>
  </section>

  <section class="hmm-card">
    <div class="hmm-card-head">
      <span class="hmm-card-title">System Event Log (SEL)</span>
      <div class="hmm-row hmm-tiny">
        <select id="sel-blade" class="hmm-input" onchange="reloadSel()">
          <option value="smm">smm (active)</option>
          <option value="othersmm">othersmm (standby)</option>
          <option value="Swi2">Swi2</option>
          <option value="Swi3">Swi3</option>
          {% for n in [1,2,3,4,8,9,10,11,12,13,14,15,16] %}
            <option value="Slot{{n}}">Slot{{n}}</option>
          {% endfor %}
        </select>
        <button class="hmm-btn-ghost" onclick="reloadSel()">↻</button>
      </div>
    </div>
    <div class="hmm-card-body">
      <div id="h-sel"
           hx-get="/api/health/sel?bladename=smm" hx-trigger="load" hx-swap="innerHTML">
        <div class="hmm-muted hmm-tiny">Loading…</div>
      </div>
    </div>
  </section>

</main>

<script>
function reloadSel() {
  const blade = document.getElementById('sel-blade').value;
  htmx.ajax('GET', `/api/health/sel?bladename=${encodeURIComponent(blade)}`, '#h-sel');
}
</script>

</body>
</html>
