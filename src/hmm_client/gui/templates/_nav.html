<header class="hmm-header">
  <div class="hmm-row">
    <a href="/" class="hmm-brand">HMM</a>
    <span class="hmm-host">Huawei E9000 · {{ host }}</span>
    <span id="nav-alarm-badge" class="hmm-mute hmm-tiny" style="margin-left: 8px;"></span>
  </div>
  <nav class="hmm-nav">
    <a href="/"                      {% if active_nav == 'chassis' %}class="active"{% endif %}>Chassis</a>
    <a href="/chassis-settings"      {% if active_nav == 'chassis-settings' %}class="active"{% endif %}>Chassis Settings</a>
    <a href="/chassis-management"    {% if active_nav == 'chassis-management' %}class="active"{% endif %}>Chassis Management</a>
    <a href="/stateless-computing"   {% if active_nav == 'stateless-computing' %}class="active"{% endif %}>Stateless Computing</a>
    <a href="/psus-fans"             {% if active_nav == 'psus-fans' %}class="active"{% endif %}>PSUs &amp; Fans</a>
    <a href="/alarm-monitoring"      {% if active_nav == 'alarm-monitoring' %}class="active"{% endif %}>Alarm Monitoring</a>
    <a href="/system-management"     {% if active_nav == 'system-management' %}class="active"{% endif %}>System Management</a>
    <span style="opacity:0.4;">·</span>
    <a href="/health"                {% if active_nav == 'health' %}class="active"{% endif %}>Health</a>
    <a href="/snapshots"             {% if active_nav == 'snapshots' %}class="active"{% endif %}>Snapshots</a>
    <span class="hmm-mute hmm-tiny">{{ now }}</span>
  </nav>
</header>

<div id="hmm-toasts" class="hmm-toasts"></div>

<script>
// Global toast() helper available on every page that includes _nav.html.
window.toast = function(msg, kind, title) {
  const root = document.getElementById('hmm-toasts');
  if (!root) return;
  const t = document.createElement('div');
  t.className = 'hmm-toast' + (kind ? ' ' + kind : '');
  t.innerHTML = (title ? `<div class="title">${title}</div>` : '') + `<div class="msg">${msg}</div>`;
  root.appendChild(t);
  setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 240); }, 4200);
};

(async function navAlarmBadge() {
  const el = document.getElementById('nav-alarm-badge');
  if (!el) return;
  const paint = async () => {
    try {
      const r = await fetch('/api/health/alarms-summary');
      if (!r.ok) return;
      const j = await r.json();
      const parts = [];
      if (j.critical) parts.push(`<a href="/health" class="hmm-pill hmm-pill-err" title="critical">${j.critical} crit</a>`);
      if (j.major)    parts.push(`<a href="/health" class="hmm-pill hmm-pill-warn" title="major">${j.major} maj</a>`);
      if (j.minor)    parts.push(`<a href="/health" class="hmm-pill hmm-pill-mute" title="minor">${j.minor} min</a>`);
      if (!parts.length) parts.push('<span class="hmm-pill hmm-pill-ok">no active alarms</span>');
      el.innerHTML = parts.join(' ');
    } catch (_) { /* keep silent */ }
  };
  paint();
  setInterval(paint, 30000);
})();
</script>
