name: Bug report
description: Something in Vessel doesn't work as documented.
labels: ["type-bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **For security-sensitive
        bugs, please use [Security Advisories](https://github.com/popsolutions/vessel/security/advisories/new)
        instead** — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: One paragraph — what you were doing and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: |
        Minimal command sequence. If chassis state is involved, describe it
        (firmware versions, blade slot, switch slot, etc.).
      placeholder: |
        1. Run `hmm power 3 reset`
        2. Observe error: ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Vessel version / commit SHA
      placeholder: "v0.0.1 or commit hash from `git rev-parse HEAD`"
    validations:
      required: true

  - type: input
    id: chassis
    attributes:
      label: Chassis firmware (if relevant)
      description: HMM SMM version + iBMC version + CX310 VRP version
      placeholder: "SMM 6.6.7 / iBMC 3.18.5 / VRP V200R013C00"

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Redact credentials. If you have a stack trace, paste it. If the bug
        is in the live KVM path, attach the `/tmp/hmm-gui-*.log` file.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have checked existing issues at https://github.com/popsolutions/vessel/issues
          required: true
        - label: This is not a security-sensitive vulnerability (those go to Security Advisories)
          required: true
